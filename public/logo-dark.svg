<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 106" width="380" height="106">
  <defs>
    <linearGradient id="badgeGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143426"/>
      <stop offset="50%" stop-color="#1e4d39"/>
      <stop offset="100%" stop-color="#2d7255"/>
    </linearGradient>
    <linearGradient id="centerWaveDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="accentTextDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glowDark" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#4ade80" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON BADGE -->
  <g transform="translate(8, 9)" filter="url(#glowDark)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#badgeGradDark)"/>
    <rect x="1" y="1" width="86" height="86" rx="21" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Harmonic Sound Waves -->
    <rect x="18" y="36" width="6" height="16" rx="3" fill="#86efac" opacity="0.8"/>
    <rect x="29" y="27" width="6" height="34" rx="3" fill="#bbf7d0" opacity="0.9"/>
    <rect x="41" y="19" width="6" height="50" rx="3" fill="url(#centerWaveDark)"/>
    <rect x="53" y="27" width="6" height="34" rx="3" fill="#bbf7d0" opacity="0.9"/>
    <rect x="64" y="36" width="6" height="16" rx="3" fill="#86efac" opacity="0.8"/>

    <!-- AI Intelligence Spark -->
    <circle cx="44" cy="19" r="4.5" fill="#ffffff"/>
    <circle cx="44" cy="19" r="2.2" fill="#15803d"/>

    <path d="M 21 44 Q 44 14 67 44" fill="none" stroke="#dcfce7" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8"/>
  </g>

  <!-- WORDMARK (White + Bright Emerald) -->
  <g transform="translate(114, 0)">
    <text x="0" y="59" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-0.035em">
      Recruit<tspan fill="url(#accentTextDark)">AI</tspan>
    </text>

    <!-- Subtitle (Crisp silver) -->
    <text x="2" y="83" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.22em">
      AI RECRUITMENT AGENT
    </text>
  </g>
</svg>
