<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143426"/>
      <stop offset="50%" stop-color="#1e4d39"/>
      <stop offset="100%" stop-color="#28684d"/>
    </linearGradient>
    <linearGradient id="centerWave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#e8f8ed"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#122c20" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(8, 8)" filter="url(#softShadow)">
    <rect x="0" y="0" width="112" height="112" rx="28" fill="url(#badgeGrad)"/>
    <rect x="1.5" y="1.5" width="109" height="109" rx="26.5" fill="none" stroke="#68d391" stroke-width="1.5" stroke-opacity="0.32"/>

    <!-- Harmonic Sound Waves -->
    <rect x="23" y="46" width="7.5" height="20" rx="3.75" fill="#74c69d" opacity="0.75"/>
    <rect x="37" y="34" width="7.5" height="44" rx="3.75" fill="#95d5b2" opacity="0.9"/>
    <rect x="52.25" y="24" width="7.5" height="64" rx="3.75" fill="url(#centerWave)"/>
    <rect x="67.5" y="34" width="7.5" height="44" rx="3.75" fill="#95d5b2" opacity="0.9"/>
    <rect x="81.5" y="46" width="7.5" height="20" rx="3.75" fill="#74c69d" opacity="0.75"/>

    <!-- AI Intelligence Spark -->
    <circle cx="56" cy="24" r="5.5" fill="#ffffff"/>
    <circle cx="56" cy="24" r="2.8" fill="#20553e"/>

    <!-- Dynamic Aura Curves -->
    <path d="M 27 56 Q 56 18 85 56" fill="none" stroke="#b7e4c7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3.5" opacity="0.65"/>
  </g>
</svg>
